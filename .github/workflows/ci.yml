# Integración continua (T007): lint, pruebas y licencias en los pull requests y en main.
name: CI

# En las ramas solo se ejecuta desde el pull request, para no repetirlo dos veces.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Binario de MongoDB que usan las pruebas con MongoMemoryReplSet; se guarda entre ejecuciones.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm run lint

      - run: npm test

      - run: npm run licenses
