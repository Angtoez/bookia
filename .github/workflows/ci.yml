# Integración continua (T007): lint, pruebas y licencias en cada push y pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Binario de MongoDB que usan las pruebas con MongoMemoryReplSet; se guarda entre ejecuciones.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm run lint

      - run: npm test

      - run: npm run licenses
